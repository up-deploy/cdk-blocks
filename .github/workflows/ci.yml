name: CI

# Two triggers, two different questions.
#   pull_request — "is this change safe to merge?"  This is the run a branch
#                  ruleset names as a required status check.
#   push         — "is the branch actually green right now?"  On 2026-07-23 main
#                  sat broken for half an hour and nothing said so, because the
#                  catalog pins a TAG: a broken main cannot reach a request, so
#                  no request ever goes red to tell you. This trigger is the
#                  only thing that would have.
#
#                  develop is listed for the same reason and matters MORE: since
#                  the Gitflow move it is the default branch and where every
#                  feature lands, while main only changes at a release. A trigger
#                  scoped to main alone would watch the quiet branch and ignore
#                  the busy one.
# push is scoped to these two deliberately; unscoped, every branch push runs the
# suite twice — once for the push and once for the PR.
on:
    pull_request:
    push:
        branches: [main, develop]

# This job reads code and runs tests; it writes nothing. The default
# GITHUB_TOKEN scope depends on an org setting and is usually broader.
permissions:
    contents: read

jobs:
    # THE JOB NAME IS A CONTRACT. It is the literal string a branch ruleset
    # names in required_status_checks. Rename it and the ruleset keeps waiting
    # on a check that no longer reports — it never goes green and never goes
    # red. Same failure class as a control that leaves no trace (see D-005).
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                persist-credentials: false
            - name: setup node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                node-version: 20
                cache: npm

            - name: install dependencies
              run: npm ci

            # `npm run build` is `tsc --noEmit`. On 2026-07-23 main did not
            # compile — this step is what catches that.
            - name: typecheck
              run: npm run build

            # Includes the POLICY:-prefixed assertions, which are the only
            # thing guarding the class-3 policy fence (private bucket, SSL-only,
            # encryption), and the cdk-nag compliance-gate suite.
            - name: test
              run: npm test
    # Proves the ENTRYPOINTS still wire the compliance gate — which the jest tests cannot,
    # because a test runs cdk-nag itself. Renders the same verdict panel as the platform's
    # scan job. Inputs are CI placeholders: this scans the code, not a real request.
    #
    # EVERY entrypoint gets scanned, not just the block. Until 2026-07-31 this job synthed
    # `bin/s3.ts` and nothing else, so deleting the cdk-nag registration from
    # `foundation/oidc.ts` left the PR GREEN — the exact hole this job exists to close,
    # sitting on the one stack that needs it most. The foundation is deployed by hand and
    # never passes through the platform's request-path scan, so this job is its ONLY
    # second pair of eyes.
    #
    # Two steps rather than a matrix: the job name `scan` is the required-check contract,
    # and a matrix renames the check to `scan (s3)` / `scan (foundation)`, so the ruleset
    # would wait forever on a check that no longer reports. Same failure class as line 30.
    #
    # Each entrypoint writes its own output dir under the already-ignored `cdk.out/`,
    # because scan-verdict.sh reads `validation-report.json` from the dir it is given and
    # a shared dir would let the second synth overwrite the first one's evidence.
    scan:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                persist-credentials: false
            - name: setup node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                node-version: 20
                cache: npm
            - name: install dependencies
              run: npm ci

            # continue-on-error so a violation (synth exits 1) does not kill the job before
            # the panel renders. The verdict is derived from the report below, not from this
            # step's exit code — the report is the authority, as in the platform's scan.
            - name: synth via the block entrypoint
              continue-on-error: true
              run: |
                npx cdk synth -a "npx ts-node bin/s3.ts" -o cdk.out/s3 \
                  -c account=111111111111 -c region=eu-west-1 -c companyId=up \
                  -c appId=ci00 -c env=dev -c blockRef=ci -c role=cidocs \
                  -c blockConfig='{"retain":false,"logBucket":"ci-log-bucket"}' \
                  -c tags='{}' \
                  1>/dev/null 2>synth-s3.log

            # The foundation takes no appId and no blockConfig: it is not a block, it is
            # the trust that lets CI reach an account at all. The github* values are
            # placeholders that satisfy the entrypoint's patterns; the real ones are
            # supplied at deploy time and never committed, since this repo is public.
            - name: synth via the foundation entrypoint
              continue-on-error: true
              run: |
                npx cdk synth -a "npx ts-node foundation/oidc.ts" -o cdk.out/foundation \
                  -c account=111111111111 -c region=eu-west-1 -c companyId=up \
                  -c env=dev -c blockRef=ci -c tags='{}' \
                  -c githubOrg=ci-org -c githubRepo=ci-repo -c githubBranch=main \
                  1>/dev/null 2>synth-foundation.log

            # The verdict logic lives in scripts/scan-verdict.sh — ONE source, shared
            # with up-platform's scan job, which consumes it from this repo's main.
            #
            # Sequential and fail-closed on purpose: the first failing verdict stops the
            # job, so a red block hides the foundation's verdict. The alternative was
            # continue-on-error plus an aggregate gate, which is how a workflow ends up
            # reporting success while something inside it failed. This repo has paid for
            # that twice already.
            - name: scan (block)
              env:
                SCAN_BLOCK: s3
                SCAN_SOURCE: ${{ github.repository }}@${{ github.sha }}
                SCAN_ENVIRONMENT: block self-scan (CI placeholder inputs)
              run: scripts/scan-verdict.sh cdk.out/s3 synth-s3.log

            - name: scan (foundation)
              env:
                SCAN_BLOCK: foundation
                SCAN_SOURCE: ${{ github.repository }}@${{ github.sha }}
                SCAN_ENVIRONMENT: foundation self-scan (CI placeholder inputs)
              run: scripts/scan-verdict.sh cdk.out/foundation synth-foundation.log
